[project]
name = "eu-additive-compliance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "google-genai>=2.16.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "reportlab>=5.0.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
